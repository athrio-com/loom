$schema: "https://moonrepo.dev/schemas/project.json"

fileGroups:
  sources:
    - "grammar.js"
    - "src/**/*"
    - "queries/**/*"
    - "editors/**/*"
    - "test/**/*"
    - "package.json"
    - "tree-sitter.json"
    - "tsconfig.json"
    - "/packages/loom-ast/src/**/*"
    - "/packages/loom-ast/package.json"
    - "/packages/loom-lang/src/**/*"
    - "/packages/loom-lang/package.json"
    - "/packages/effect-test/**/*"
    - "/corpus/**/*.loom"
    - "/docs/**/*.loom"
    - "/examples/**/*.loom"
    - "/tsconfig.base.json"
    - "/package.json"
    - "/bun.lock"
    - "/bunfig.toml"

tasks:
  install:
    command: "bun install --frozen-lockfile"
    options:
      cache: false
      internal: true
      runFromWorkspaceRoot: true

  typecheck:
    command: "bunx tsc --noEmit -p tsconfig.json"
    deps: ["install"]
    inputs:
      - "@group(sources)"
      - "moon.yml"
      - "/mise.toml"

  test:
    command: "bun test"
    deps: ["install"]
    inputs:
      - "@group(sources)"
      - "moon.yml"
      - "/mise.toml"

  pin:
    command: "bun scripts/pin-grammar.ts"
    deps: ["install"]
    options:
      cache: false
      runFromWorkspaceRoot: true
