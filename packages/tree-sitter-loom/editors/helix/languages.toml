[[language]]
name = "loom"
scope = "source.loom"
file-types = ["loom"]
roots = [".loom"]
injection-regex = "^loom$"
language-servers = ["loom"]

[language-server.loom]
command = "loom"
args = ["lsp", "--stdio"]

