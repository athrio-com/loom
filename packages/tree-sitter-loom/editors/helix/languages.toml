[[language]]
name = "loom"
scope = "source.loom"
file-types = ["loom"]
roots = [".loom/config.yaml"]
injection-regex = "^loom$"
language-servers = ["loom"]

[language-server.loom]
command = "loom"
args = ["lsp", "--stdio"]

[[grammar]]
name = "loom"
source = { git = "https://github.com/athrio-com/loom", rev = "d3f48ecf4d874084718ea5a01ff4f6f58f902138", subpath = "packages/tree-sitter-loom" }
