[[language]]
name = "loom"
scope = "source.loom"
file-types = ["loom"]
roots = [".loom/config.yaml"]
injection-regex = "^loom$"
language-servers = ["loom"]

[language-server.loom]
command = "loom"
args = ["lsp", "--stdio"]

[[grammar]]
name = "loom"
source = { git = "https://github.com/athrio-com/loom", rev = "006f787f7c60de045921fbdff0e4b977c1f22c9c", subpath = "packages/tree-sitter-loom" }
