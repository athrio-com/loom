[[language]]
name = "loom"
scope = "source.loom"
file-types = ["loom"]
roots = [".loom/config.yaml"]
injection-regex = "^loom$"
language-servers = ["loom"]

[language-server.loom]
command = "loom"
args = ["lsp", "--stdio"]

[[grammar]]
name = "loom"
source = { git = "https://github.com/athrio-com/loom", rev = "a2dbcd01d2ac8bbc6030753718d12dbe5c16ecd8", subpath = "packages/tree-sitter-loom" }
