[[language]]
name = "loom"
scope = "source.loom"
file-types = ["loom"]
roots = [".loom/config.yaml"]
injection-regex = "^loom$"
language-servers = ["loom"]

[language-server.loom]
command = "loom"
args = ["lsp", "--stdio"]

[[grammar]]
name = "loom"
source = { git = "https://github.com/athrio-com/loom", rev = "bbadbf24e9cb8b131a2f3fa5e390e9929960bd01", subpath = "packages/tree-sitter-loom" }
