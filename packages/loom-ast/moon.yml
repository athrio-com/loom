$schema: "https://moonrepo.dev/schemas/project.json"

fileGroups:
  sources:
    - "src/**/*"
    - "test/**/*"
    - "package.json"
    - "tsconfig.json"
    - "/packages/effect-test/**/*"
    - "/tsconfig.base.json"
    - "/package.json"
    - "/bun.lock"
    - "/bunfig.toml"

tasks:
  install:
    command: "bun install --frozen-lockfile"
    options:
      cache: false
      internal: true
      runFromWorkspaceRoot: true

  typecheck:
    command: "bunx tsc --noEmit -p tsconfig.json"
    deps: ["install"]
    inputs:
      - "@group(sources)"
      - "moon.yml"
      - "/mise.toml"

  test:
    command: "bun test"
    deps: ["install"]
    inputs:
      - "@group(sources)"
      - "moon.yml"
      - "/mise.toml"
