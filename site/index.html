    <meta property="og:description" content="Literate programming framework that keeps meaning in your codebase from evaporating. Write your program the way you write a book, with the reasoning in prose and code — as one source." />

    <link rel="preload" href="/fonts/lilex.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet" />
    <style>
      @font-face {
        font-family: 'Lilex';
        src: url('/fonts/lilex.woff2') format('woff2');
        font-weight: 100 700;
        font-display: swap;
      }
      @font-face {
        font-family: 'Space Grotesk';
        src: url('/fonts/space-grotesk.woff2') format('woff2');
        font-weight: 300 700;
        font-display: swap;
      }
      @font-face {
        font-family: 'Lilex Menlo';
        src: local('Menlo Regular'), local('Menlo-Regular'), local('DejaVu Sans Mono');
        size-adjust: 99.65%;
        ascent-override: 100.25%;
        descent-override: 30.21%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: 'Lilex Consolas';
        src: local('Consolas');
        size-adjust: 109.13%;
        ascent-override: 91.54%;
        descent-override: 27.58%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: 'Lilex Courier';
        src: local('Courier New'), local('CourierNewPSMT');
        size-adjust: 99.98%;
        ascent-override: 99.92%;
        descent-override: 30.11%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: 'Space Grotesk Arial';
        src: local('Arial'), local('ArialMT'), local('Liberation Sans'), local('Arimo');
        size-adjust: 109.46%;
        ascent-override: 89.9%;
        descent-override: 26.68%;
        line-gap-override: 0%;
      }
    </style>

    <meta name="color-scheme" content="light dark" />
    <script>
      ;(() => {
        const root = document.documentElement
        const device = matchMedia('(prefers-color-scheme: dark)')
        const CHOICES = ['system', 'light', 'dark']

        const chosen = () => {
          try {
            const kept = localStorage.getItem('theme')
            return CHOICES.includes(kept) ? kept : 'system'
          } catch {
            return 'system'
          }
        }

        const keep = (choice) => {
          try {
            if (choice === 'system') localStorage.removeItem('theme')
            else localStorage.setItem('theme', choice)
          } catch {}
        }

        const deviceTheme = () => (device.matches ? 'dark' : 'light')
        const worn = (choice) => (choice === 'system' ? deviceTheme() : choice)
        const opposite = (theme) => (theme === 'dark' ? 'light' : 'dark')
        const next = (choice) =>
          choice !== 'system' && choice !== deviceTheme() ? 'system' : opposite(worn(choice))

        const apply = () => {
          const choice = chosen()
          root.dataset.swapping = ''
          root.dataset.choice = choice
          root.dataset.theme = worn(choice)
          getComputedStyle(root).color
          requestAnimationFrame(() => delete root.dataset.swapping)
        }

        apply()
        device.addEventListener('change', apply)
        addEventListener('storage', apply)
        document.addEventListener('click', (event) => {
          if (!(event.target instanceof Element) || !event.target.closest('[data-theme-toggle]')) return
          keep(next(chosen()))
          apply()
        })
      })()
    </script>
    <script type="module" src="/src/client.ts"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
